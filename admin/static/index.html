<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>TRIMM katalogy</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--b:#e3e3e0;--bg:#f4f4f2;--acc:#ff6b1a;--txt:#1a1a1a;--mut:#777}
html,body{height:100%}
body{font:13px/1.45 'Helvetica Neue',Helvetica,Arial,sans-serif;color:var(--txt);background:var(--bg);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:#111;color:#fff;flex-shrink:0}
header b{letter-spacing:.3em;font-size:15px}
header a{color:#bbb;text-decoration:none;padding:5px 2px;border-bottom:2px solid transparent;cursor:pointer}
header a:hover{color:#fff}header a.on{color:#fff;border-color:var(--acc)}
header a.logo{color:#fff;border:none}
#sub{display:none;align-items:center;gap:18px;padding:0 16px;background:#fff;border-bottom:1px solid var(--b);flex-shrink:0;min-height:44px}
#sub b{font-size:14px;margin-right:6px}
#sub a{color:var(--mut);text-decoration:none;padding:12px 1px 10px;border-bottom:2px solid transparent;cursor:pointer}
#sub a:hover{color:var(--txt)}#sub a.on{color:var(--txt);font-weight:700;border-color:var(--acc)}
#ctxBtn{display:flex;gap:8px}
#fbBtn{position:fixed;right:18px;bottom:18px;z-index:40;border-radius:22px;padding:9px 16px;background:#111;color:#fff;border-color:#111;box-shadow:0 4px 16px rgba(0,0,0,.25);font-weight:700}
#fbBtn:hover{background:var(--acc);border-color:var(--acc)}
#fbPanel{position:fixed;right:18px;bottom:66px;z-index:41;width:380px;max-width:calc(100vw - 36px);max-height:calc(100vh - 90px);overflow:auto;background:#fff;border:1px solid var(--b);border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.22);padding:14px;display:none;flex-direction:column;gap:10px}
#fbPanel textarea{width:100%;min-height:96px;padding:8px 10px;border:1px solid var(--b);border-radius:4px;font:inherit;resize:vertical}
#fbPanel .shot{position:relative;border:1px solid var(--b);border-radius:6px;overflow:hidden;background:#fafaf8}#fbPanel .shot img{display:block;width:100%;max-height:200px;object-fit:contain;cursor:pointer}
#fbPanel .shot .x{position:absolute;right:4px;top:4px;background:#fff;border-radius:50%}
#fbPanel .mine{border-top:1px solid #f0f0ee;padding:8px 0;font-size:12px}#fbPanel .mine .re{background:#f4f4f2;border-radius:6px;padding:6px 8px;margin-top:4px}
#fbDraw{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.8);display:none;flex-direction:column}
#fbDraw .tools{display:flex;gap:10px;align-items:center;background:#fff;padding:10px 16px}
#fbDraw .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:16px}#fbDraw canvas{background:#fff;cursor:crosshair;box-shadow:0 0 0 1px #000;touch-action:none}
.fk{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:#777}.fk.chyba{background:#c0392b}.fk.napad{background:#2e8b3d}.fk.dotaz{background:#1e73be}
#feedv .fitem{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #f0f0ee}#feedv .fitem.done{opacity:.6}
#feedv .fitem img{width:150px;height:96px;object-fit:cover;object-position:top left;border:1px solid var(--b);border-radius:4px;cursor:zoom-in;flex-shrink:0}
#feedv .fitem .tx{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word}#feedv .re{background:#f4f4f2;border-radius:6px;padding:6px 8px;margin-top:6px;font-size:12px}
#menu{position:fixed;z-index:80;background:#fff;border:1px solid var(--b);border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.14);padding:4px;min-width:180px}
#menu div{padding:7px 12px;border-radius:4px;cursor:pointer;white-space:nowrap}#menu div:hover{background:#f4f4f2}#menu div.dan{color:#c0392b}#menu div small{display:block;color:var(--mut);font-size:11px}
button.more{padding:3px 9px;font-size:15px;line-height:1;letter-spacing:.05em}
#list .tools .inline{flex-wrap:nowrap}#bAdd{white-space:nowrap;flex-shrink:0}#list .tools select{flex:1;min-width:0;padding:5px 6px;font-size:12px}
.sp{flex:1}
.view{display:none;flex:1;min-height:0}
.page{overflow:auto;padding:22px 28px 60px;width:100%}
.page h1{font-size:22px;letter-spacing:.02em}
.phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.gh{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:22px 0 10px;font-weight:800}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
.cat{background:#fff;border:1px solid var(--b);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.cat .cov{height:170px;background:#ddd center/cover no-repeat;position:relative;cursor:pointer}
.cat .cov.pdf{background-size:contain;background-color:#ecece8}
.cat .tag{position:absolute;left:10px;top:10px;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:800;letter-spacing:.1em;color:#fff;background:#f39200}
.cat .tag.FW{background:#1e73be}
.cat .st{position:absolute;right:10px;top:10px;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;background:rgba(255,255,255,.92);color:#333}
.cat .st.draft{background:var(--acc);color:#fff}
.cat .bd2{padding:12px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.cat h3{font-size:16px;letter-spacing:.03em}.cat h3 small{color:var(--mut);font-weight:400;font-size:12px;margin-left:6px}
.cat .nums{font-size:12px;color:#444}.cat .vs{font-size:11px;color:var(--mut)}
.vs b.plus,.strip b.plus{color:#2e8b3d}.vs b.minus,.strip b.minus{color:#c0392b}.vs b.chg,.strip b.chg{color:#c77700}
.files{display:flex;flex-direction:column;gap:3px}
.files a{display:flex;gap:8px;align-items:center;padding:5px 8px;border:1px solid #eee;border-radius:4px;text-decoration:none;color:var(--txt);font-size:12px;background:#fafaf8}
.files a:hover{border-color:var(--acc)}
.ext{font-size:9px;font-weight:800;color:#fff;background:#c0392b;border-radius:3px;padding:2px 5px;letter-spacing:.05em}
.ext.html{background:#2a8fc8}
.files small{color:var(--mut);margin-left:auto;white-space:nowrap}
.cat .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.tile-new{border:2px dashed var(--b);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:96px;cursor:pointer;background:#fafaf8;color:#555;font-weight:700;padding:14px;text-align:center}
.tile-new:hover{border-color:var(--acc);color:var(--acc)}.tile-new small{font-weight:400;color:var(--mut)}
.news{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.lock{background:#fff7e0;border:1px solid #ecd9a0;border-radius:6px;padding:8px 12px;margin-bottom:12px;font-size:12px}
.lock a{color:var(--acc)}
.pst{font-size:9px;font-weight:800;letter-spacing:.06em;border-radius:3px;padding:1px 5px;margin-left:4px;vertical-align:middle}
.pst.new{background:#e3f4e6;color:#2e8b3d}.pst.changed{background:#fff0d6;color:#c77700}
.seg{display:inline-flex;border:1px solid var(--b);border-radius:4px;overflow:hidden}
.seg span{padding:4px 10px;font-size:11px;cursor:pointer;background:#fff;border-right:1px solid var(--b);color:var(--txt)}.seg span:last-child{border:none}
.seg span.on{background:#111;color:#fff}
.strip{padding:7px 12px;border-bottom:1px solid var(--b);font-size:11.5px;line-height:1.5;background:#fafaf8}
.strip a{color:var(--acc);cursor:pointer;text-decoration:underline;margin-left:8px;white-space:nowrap}
.panes{flex:1;display:flex;min-height:0}
.pane{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.pane+.pane{border-left:1px solid var(--b)}
.pane .pt{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);padding:5px 12px;border-bottom:1px solid #eee;background:#fff}
.pane iframe{flex:1;border:0;width:100%}
.pane .pb{flex:1;overflow:auto;display:flex;flex-direction:column;min-height:0}
.pane .pb img{width:100%;display:block}
#preview[data-mode=cur] #paPrev,#preview[data-mode=prev] #paCur{display:none}
.stor{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stor .f{background:#fff;border:1px solid var(--b);border-radius:6px;padding:6px;cursor:pointer;font-size:10px;color:#555;word-break:break-all;position:relative}
.stor .f:hover{border-color:var(--acc)}
.stor .f img{width:100%;height:110px;object-fit:contain;display:block;margin-bottom:4px;background:repeating-conic-gradient(#f3f3f3 0 25%,#fff 0 50%) 0 0/14px 14px}
.stor .u{position:absolute;right:8px;top:8px;border-radius:20px;padding:1px 7px;font-size:10px;font-weight:700;background:#111;color:#fff}
.stor .u.no{background:#c0392b}
.drop{outline:3px dashed var(--acc);outline-offset:-8px}
.det{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;min-height:0;overflow:auto}
.det img{max-width:100%;max-height:62vh;object-fit:contain;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/20px 20px}
.det ul{list-style:none;max-height:40vh;overflow:auto}.det li{padding:3px 0;border-bottom:1px solid #f0f0ee;font-size:12px}.det li a{color:var(--acc)}
.srow{display:grid;grid-template-columns:54px 1fr 1.4fr 60px 28px;gap:8px;align-items:center;margin-bottom:6px}
.pgs{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 14px 62px}
.pgs .pg{position:relative;border:1px solid var(--b);border-radius:4px;background:#fff}.pgs .pg img{height:84px;display:block}
.pgs .pg .x{position:absolute;right:2px;top:-2px;background:#fff;border-radius:50%;width:18px;height:18px;line-height:16px;color:#c0392b}
.pgs .add{height:86px;width:70px;border:2px dashed var(--b);border-radius:4px;display:flex;align-items:center;justify-content:center;color:#aaa;cursor:pointer;font-size:11px;text-align:center}
.pgs .add:hover{border-color:var(--acc);color:var(--acc)}
.frow{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid #f0f0ee;font-size:12px}
.frow a{color:var(--txt);font-weight:700}
.wrap{max-width:980px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.tiles div{background:#fff;border:1px solid var(--b);border-radius:6px;padding:12px 14px;font-size:11px;color:var(--mut)}
.tiles b{display:block;font-size:26px;line-height:1.1;color:var(--txt)}
table.plan{width:100%;border-collapse:collapse;font-size:12px}
table.plan td{padding:6px 8px;border-bottom:1px solid #f0f0ee;vertical-align:top}
table.plan td:first-child{width:26px}table.plan td.nm{font-weight:700;white-space:nowrap;width:210px}
table.plan select{width:auto;max-width:330px;padding:4px 6px}
table.plan b.plus{color:#2e8b3d}table.plan b.minus{color:#c0392b}table.plan b.chg{color:#c77700}
#cardsv .frow{gap:12px;padding:6px 0}#cardsv input[type=search],#pcQ{padding:7px 10px;border:1px solid var(--b);border-radius:4px;font:inherit}#cardsv .frow img,#cardsv .frow .noimg{width:52px;height:40px;object-fit:contain;background:#fff;border:1px solid #eee;border-radius:3px;flex-shrink:0}#cardsv a.chip{text-decoration:none;color:inherit}#cardsv a.chip.on{color:#fff}
#verv b.plus{color:#2e8b3d}#verv b.minus{color:#c0392b}#verv b.chg{color:#c77700}#verv .frow{padding:9px 0}#verv .frow .hint{margin-top:2px}
.upz{border:2px dashed var(--b);border-radius:8px;padding:22px;text-align:center;background:#fafaf8;cursor:pointer;margin-bottom:14px}
.upz:hover,.upz.over{border-color:var(--acc);background:#fff4ec}
button{font:inherit;padding:7px 12px;border:1px solid var(--b);background:#fff;border-radius:4px;cursor:pointer;color:var(--txt)}
button:hover{border-color:#999}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
button.dan{color:#c0392b}
button.sm{padding:3px 8px;font-size:11px}
main{flex:1;display:grid;grid-template-columns:300px 1fr 470px;min-height:0;width:100%}
main.side{grid-template-columns:270px minmax(340px,1fr) minmax(680px,47vw)}
#list{border-right:1px solid var(--b);background:#fff;display:flex;flex-direction:column;min-height:0}
#list .tools{padding:10px;border-bottom:1px solid var(--b);display:flex;flex-direction:column;gap:8px}
.tr{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:5px;vertical-align:middle}.tr-full{background:#3aa55d}.tr-part{background:#f0a500}.tr-none{background:#e2001a}
.orig{font-size:11.5px;color:#555;background:#f6f6f4;border-left:3px solid #ddd;padding:6px 8px;border-radius:3px;margin:2px 0 4px;white-space:pre-wrap;line-height:1.4}
input.ro,textarea.ro{opacity:.6;background:#f6f6f4}
#langSeg span{padding:4px 11px;cursor:pointer;font-size:12px;font-weight:700}#langSeg span.on{background:#1a1a1a;color:#fff}
.tfld{display:grid;grid-template-columns:200px 1fr 1fr;gap:8px;margin-bottom:6px;align-items:center}
#list input{width:100%;padding:7px 10px;border:1px solid var(--b);border-radius:4px;font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{padding:4px 9px;border:1px solid var(--b);border-radius:20px;font-size:11px;background:#fff;cursor:pointer}
.chip.on{background:#111;color:#fff;border-color:#111}
#items{overflow:auto;flex:1}
.serie-h{padding:8px 12px 4px;font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--mut);text-transform:uppercase;background:#fafaf8;border-top:1px solid var(--b);border-bottom:1px solid var(--b);position:sticky;top:0}
.item{display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:1px solid #f0f0ee;cursor:pointer}
.item:hover{background:#fff8f3}.item.on{background:#fff1e8}
.item img{width:44px;height:34px;object-fit:contain;background:#fff;border:1px solid #eee;border-radius:3px;flex-shrink:0}
.item .nm{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .nm small{display:block;font-weight:400;color:var(--mut);font-size:11px}
.item .mv{display:none;gap:2px}.item:hover .mv{display:flex}
.item .mv button{padding:1px 5px;font-size:10px}
#form{overflow:auto;padding:16px 20px;min-height:0}
#preview{border-left:1px solid var(--b);background:#fff;display:flex;flex-direction:column;min-height:0}
#preview .ph{padding:8px 12px;border-bottom:1px solid var(--b);font-size:11px;color:var(--mut);display:flex;gap:8px;align-items:center}
.sec{background:#fff;border:1px solid var(--b);border-radius:6px;padding:14px 16px;margin-bottom:14px}
.sec h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:10px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:10px}
label{display:block;font-size:11px;font-weight:700;color:#444;margin-bottom:3px}
input[type=text],input[type=number],select,textarea{width:100%;padding:7px 9px;border:1px solid var(--b);border-radius:4px;font:inherit;background:#fff}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
.fld{display:grid;grid-template-columns:190px 1fr 28px;gap:8px;align-items:center;margin-bottom:6px}
.fld input:first-child{font-weight:700;text-transform:uppercase;font-size:11px}
.x{border:none;background:none;color:#bbb;font-size:16px;cursor:pointer;padding:0}
.x:hover{color:#c0392b}
.photos{display:flex;flex-wrap:wrap;gap:12px}
.slot{width:170px}
.slot .dz{height:120px;border:2px dashed var(--b);border-radius:6px;display:flex;align-items:center;justify-content:center;background:#fafaf8;position:relative;overflow:hidden;cursor:pointer}
.slot .dz.over{border-color:var(--acc);background:#fff4ec}
.slot .dz img{max-width:100%;max-height:100%;object-fit:contain}
.slot .dz span{color:#bbb;font-size:11px;text-align:center;padding:8px}
.slot .cap{display:flex;justify-content:space-between;align-items:center;margin-top:4px;font-size:11px}
.slot .cap b{font-size:11px}
table.colors{width:100%;border-collapse:collapse}
table.colors th{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);text-align:left;padding:4px 6px;border-bottom:1px solid var(--b)}
table.colors td{padding:6px;border-bottom:1px solid #f0f0ee;vertical-align:top}
table.colors .dz{width:78px;height:64px;border:1px dashed var(--b);border-radius:4px;display:flex;align-items:center;justify-content:center;background:#fafaf8;cursor:pointer;position:relative}
table.colors .dz.over{border-color:var(--acc)}
table.colors .dz img{max-width:100%;max-height:100%;object-fit:contain}
table.colors .dz span{color:#ccc;font-size:10px}
table.colors .dz{width:96px;height:78px}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.bd{display:flex;align-items:center;gap:6px;border:1px solid var(--b);border-radius:4px;padding:4px 8px;cursor:pointer;background:#fff}
.bd.on{border-color:var(--acc);background:#fff4ec}
.bd img{height:26px;max-width:80px;object-fit:contain}
.bd small{font-size:10px;color:#555}
.temps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bar{display:flex;gap:8px;align-items:center;position:sticky;top:0;background:var(--bg);padding:6px 0 12px;z-index:5}
.bar h1{font-size:20px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{font-size:11px;color:var(--mut)}
.empty{padding:60px 20px;text-align:center;color:var(--mut)}
.slot .dz .tb,table.colors .dz .tb{position:absolute;left:0;right:0;bottom:0;display:none;justify-content:center;gap:2px;padding:3px;background:rgba(255,255,255,.92)}
.slot .dz:hover .tb,table.colors .dz:hover .tb{display:flex}
.tb button{padding:2px 6px;font-size:11px;line-height:1.2}
.dz.active{outline:2px solid var(--acc)}
#pm{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:60}
#pm .box{background:#fff;border-radius:8px;padding:14px;width:min(1000px,94vw);max-height:92vh;display:flex;flex-direction:column;gap:10px}
#pm .tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#pm .stage{position:relative;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/20px 20px;display:flex;align-items:center;justify-content:center;overflow:hidden;height:min(62vh,640px);user-select:none}
#pm .stage img{max-width:100%;max-height:100%;display:block;pointer-events:none}
#pm .stage canvas{position:absolute;left:0;top:0}
#pm .crop{position:absolute;border:2px dashed var(--acc);background:rgba(255,107,26,.12);pointer-events:none}
#pm .lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;overflow:auto;max-height:62vh}
#pm .lib div{border:1px solid var(--b);border-radius:4px;padding:4px;cursor:pointer;text-align:center;font-size:10px;color:#555;word-break:break-all}
#pm .lib div:hover{border-color:var(--acc)}
#pm .lib img{width:100%;height:90px;object-fit:contain;background:#fff}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50}
#modal .box{background:#fff;border-radius:8px;padding:18px;width:min(640px,92vw);max-height:80vh;display:flex;flex-direction:column;gap:10px}
#modal pre{background:#111;color:#ddd;padding:12px;border-radius:6px;font-size:12px;overflow:auto;flex:1;white-space:pre-wrap}
.hint{font-size:11px;color:var(--mut)}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<header><a class="logo" href="#/"><b>TRIMM</b></a><a href="#/" id="nHome">Katalogy</a><a href="#/karty" id="nCards">Karty produktů</a><a href="#/fotky" id="nFoto">Úložiště fotek</a><a href="#/uzivatele" id="nUsers" style="display:none">Uživatelé</a><a href="#/podnety" id="nFeed" style="display:none">Podněty</a>
 <span class="sp"></span>
 <span id="who" style="display:none;align-items:center;gap:8px;font-size:12px;color:#bbb"><span id="whoMail"></span><a id="bPw">heslo</a><a id="bOut">odhlásit</a></span>
</header>
<nav id="sub"><b id="ctxCode"></b><a id="nEdit">Produkty</a><a id="nForm">Objednávkový formulář</a><a id="nVer">Verze</a><a id="nSet">Nastavení</a><span class="sp"></span>
 <span id="ctxBtn"><button id="bOpen" title="Celý katalog s aktuálně uloženými změnami (bez generování)">Náhled katalogu</button><button id="bGen" class="pri">Vygenerovat katalog</button></span></nav>
<div class="view" id="vHome"><div class="page" id="home"></div></div>
<div class="view" id="vEditor">
<main>
 <aside id="list">
  <div class="tools">
   <div class="inline"><input id="q" type="search" placeholder="Hledat model…"><button id="bAdd" class="pri" title="Přidat produkt do katalogu">+ Přidat</button></div>
   <div class="inline"><select id="secSel" title="Sekce"></select><select id="prevSel" title="Změny oproti loňskému katalogu"></select></div>
   <div class="inline"><div class="seg" id="langSeg" title="Jazyk karty: česky se upravuje všechno, v jiném jazyce jen překlad textů"></div><select id="trSel" title="Stav překladu" style="display:none"></select></div>
  </div>
  <div id="items"></div>
 </aside>
 <section id="form"><div class="empty">Vyber produkt vlevo nebo založ nový.</div></section>
 <aside id="preview" data-mode="cur"><div class="ph"><div class="seg" id="pvSeg"><span data-m="cur">Letos</span><span data-m="prev">Loni</span><span data-m="side">Vedle sebe</span></div></div>
  <div class="strip" id="pvStrip" style="display:none"></div>
  <div class="panes"><div class="pane" id="paCur"><div class="pt" id="ptCur">Letos</div><iframe id="pv"></iframe></div><div class="pane" id="paPrev"><div class="pt" id="ptPrev">Loni</div><div class="pb" id="pvPrev"></div></div></div>
 </aside>
</main>
</div>
<div class="view" id="vStorage"><div class="page" id="storage"></div></div>
<div class="view" id="vForm"><div class="page" id="formv"></div></div>
<div class="view" id="vFeed"><div class="page" id="feedv"></div></div>
<div class="view" id="vCards"><div class="page" id="cardsv"></div></div>
<div class="view" id="vVer"><div class="page" id="verv"></div></div>
<div class="view" id="vUsers"><div class="page" id="usersv"></div></div>
<div class="view" id="vSettings"><div class="page" id="settings"></div></div>
<button id="fbBtn" title="Napiš, co nefunguje nebo co by šlo zlepšit">💬 Podnět</button>
<div id="fbPanel"></div>
<div id="fbDraw"><div class="tools"><b>Vyznač, o co jde</b><div class="seg" id="fdTool"><span data-t="pen" class="on">Tužka</span><span data-t="oval">Kroužek</span><span data-t="arrow">Šipka</span></div><button class="sm" id="fdUndo">Zpět</button><span class="sp"></span><button id="fdCancel">Zrušit</button><button class="pri" id="fdOk">Hotovo</button></div><div class="stage"><canvas id="fdCv"></canvas></div></div>
<div id="pm"><div class="box"><div class="inline"><b id="pmTitle">Fotka</b><span class="sp"></span><button id="pmClose">Zavřít</button></div><div id="pmBody"></div></div></div>
<div id="modal"><div class="box"><b id="mTitle">Generování katalogu</b><div class="inline"><span id="gLangs"></span><label class="inline"><input type="checkbox" id="gPdf" checked> Vytvořit i PDF</label><label class="inline"><input type="checkbox" id="gPush"> Odeslat na GitHub (commit + push)</label></div><div class="inline" style="margin-top:6px"><label class="inline">Ceny <select id="gPrices"><option value="auto">Kč jen v české verzi</option><option value="czk">Kč ve všech jazycích</option><option value="none">bez cen</option></select></label></div><pre id="mLog">Připraveno.</pre><div class="inline"><button id="mRun" class="pri">Spustit</button><span id="mOut"></span><span class="sp"></span><button id="mClose">Zavřít</button></div></div></div>

<script>
window.addEventListener('error',e=>{const st=document.getElementById('st');if(st)st.textContent='CHYBA: '+e.message;console.error(e.error||e.message)});
window.addEventListener('unhandledrejection',e=>{const st=document.getElementById('st');if(st)st.textContent='CHYBA: '+(e.reason&&e.reason.message||e.reason);console.error(e.reason)});
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const api=async(u,o={})=>{const r=await fetch(u,{headers:{'Content-Type':'application/json'},...o});if(r.status===401){location.href='/login';throw new Error('Nepřihlášeno')}if(!r.ok)throw new Error(await r.text());return r.headers.get('content-type')?.includes('json')?r.json():r.text()};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtSize=n=>n>1048576?(n/1048576).toFixed(n>10485760?0:1).replace('.',',')+' MB':Math.max(1,Math.round(n/1024))+' kB';
const fmtDate=t=>new Date(t*1000).toLocaleDateString('cs-CZ',{day:'numeric',month:'numeric',year:'numeric'});
const fmtKc=v=>v==null?'—':String(v).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const pl=(n,a,b,c)=>n+' '+(n===1?a:(n>=2&&n<=4?b:c));
const store={get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
// rozbalovací nabídka u tlačítka: items = [{label, sub, dan, fn}]
function closeMenu(){const m=$('#menu');if(m)m.remove()}
function menu(a,items){closeMenu();const m=document.createElement('div');m.id='menu';m.innerHTML=items.map((it,i)=>`<div data-i="${i}"${it.dan?' class="dan"':''}>${esc(it.label)}${it.sub?`<small>${esc(it.sub)}</small>`:''}</div>`).join('');document.body.appendChild(m);
 const r=a.getBoundingClientRect();m.style.top=Math.min(r.bottom+4,innerHeight-m.offsetHeight-8)+'px';m.style.left=Math.max(8,Math.min(r.left,innerWidth-m.offsetWidth-8))+'px';
 m.onclick=e=>{const d=e.target.closest('[data-i]');if(d){closeMenu();items[+d.dataset.i].fn()}}}
function errText(e){try{return JSON.parse(e.message).detail||e.message}catch(_){return e.message}}
let RC=null;   // katalog, ve kterém se právě pohybuju
let META, LIST=[], REMOVED=[], cur=null, dirty=false, curSec='all', curPrev='all', CODE=null, API='', CATS=[], KINDS=[], lastHash='';
// jazyk karty v editoru: čeština = zdroj (upravuje se všechno), jiný jazyk = jen překlad textů (i18n[lang] v kartě)
let LANG=new URLSearchParams(location.search).get('lang')||store.get('lang','cs'), curTr='all', LANGS=[['cs','Čeština'],['en','English']];
function langName(l){return (LANGS.find(x=>x[0]===l)||[])[1]||l.toUpperCase()}
function renderLangSeg(){const el=$('#langSeg');if(!el)return;el.innerHTML=LANGS.map(([k,l])=>`<span data-l="${k}" class="${k===LANG?'on':''}" title="${esc(l)}">${k.toUpperCase()}</span>`).join('');
 el.onclick=e=>{const sp=e.target.closest('span[data-l]');if(!sp||sp.dataset.l===LANG)return;if(dirty&&!confirm('Zahodit neuložené změny?'))return;setLang(sp.dataset.l)}}
async function setLang(l){LANG=l;store.set('lang',l);curTr='all';renderLangSeg();ptCur();renderList();if(cur){dirty=false;await openProduct(cur.id,true)}}
function ptCur(){if(META)$('#ptCur').textContent='Letos · '+META.catalog.label+(LANG==='cs'?'':' · '+LANG.toUpperCase())}
function trOf(p){return (p.tr&&p.tr[LANG])||''}
function trDot(p){const t=trOf(p);return LANG!=='cs'&&t?`<i class="tr tr-${t}" title="${t==='full'?'Přeloženo':t==='part'?'Přeloženo částečně':'Nepřeloženo'}"></i>`:''}

// ---------- směrování: #/ katalogy · #/k/SS27 produkty · #/k/SS27/p/<id> · #/k/SS27/nastaveni · #/fotky ----------
function show(v){$$('.view').forEach(x=>x.style.display=x.id===v?'flex':'none');$('#nHome').classList.toggle('on',v==='vHome');$('#nFoto').classList.toggle('on',v==='vStorage');$('#nCards').classList.toggle('on',v==='vCards');$('#nFeed').classList.toggle('on',v==='vFeed');$('#nUsers').classList.toggle('on',v==='vUsers');
 const inCat=v==='vEditor'||v==='vSettings'||v==='vForm'||v==='vVer';$('#nForm').classList.toggle('on',v==='vForm');$('#nVer').classList.toggle('on',v==='vVer');$('#sub').style.display=inCat?'flex':'none';
 $('#nEdit').classList.toggle('on',v==='vEditor');$('#nSet').classList.toggle('on',v==='vSettings')}
async function route(){
 if(dirty&&location.hash!==lastHash&&!confirm('Zahodit neuložené změny?')){history.replaceState(null,'',lastHash||'#/');return}
 if(location.hash!==lastHash)dirty=false; lastHash=location.hash;
 const [a,b,c,d]=location.hash.replace(/^#\/?/,'').split('/');
 try{
  if(a==='k'&&b){RC=b;const rc=CATS.find(x=>x.code===b),isDb=!rc||rc.source==='db';$('#ctxCode').textContent=rc?rc.label:b;
   ['#nEdit','#nForm','#nVer','#ctxBtn'].forEach(q=>$(q).style.display=isDb?'':'none');$('#bGen').style.display=rc&&rc.status==='done'?'none':'';$('#nEdit').href='#/k/'+b;$('#nSet').href='#/k/'+b+'/nastaveni';$('#nForm').href='#/k/'+b+'/formular';$('#nVer').href='#/k/'+b+'/verze';
   if(c==='nastaveni')await showSettings(b); else if(c==='formular')await showForm(b); else if(c==='verze')await showVersions(b); else await showEditor(b,c==='p'&&d?decodeURIComponent(d):null)}
  else if(a==='fotky')await showStorage(); else if(a==='karty')await showCards(); else if(a==='podnety')await showFeed(); else if(a==='uzivatele')await showUsers(); else await showHome();
 }catch(e){alert(errText(e))}
}
window.addEventListener('hashchange',route);
function boot(){
 $('#q').oninput=renderList;
 $('#secSel').onchange=e=>{curSec=e.target.value;renderList()}; $('#prevSel').onchange=e=>{curPrev=e.target.value;renderList()};
 $('#bAdd').onclick=e=>META.linked?menu(e.currentTarget,[{label:'Nový produkt',sub:'založí novou kartu',fn:newProduct},{label:'Z existujících karet',sub:'zařadí kartu, která už je v jiném katalogu',fn:pickCards}]):newProduct();
 $('#bGen').onclick=()=>openGen(RC); $('#bOpen').onclick=()=>window.open('/nahled/'+RC+'?lang='+LANG+(cur&&CODE===RC&&$('#vEditor').style.display!=='none'?'#m-'+cur.id:''),'_blank');
 document.addEventListener('mousedown',e=>{if(!e.target.closest('#menu'))closeMenu()});
 $('#pvSeg').onclick=e=>{const m=e.target.dataset.m;if(m)setMode(m)};
 $('#mClose').onclick=()=>$('#modal').style.display='none'; $('#mRun').onclick=runGen;
 document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();if(cur&&$('#vEditor').style.display!=='none')save()}});
 window.onbeforeunload=()=>dirty?'Neuložené změny':null;
 setMode(store.get('pvMode',innerWidth>=1650?'side':'cur'));
 route();
}
function setMode(m){$('#preview').dataset.mode=m;$('main').classList.toggle('side',m==='side');$$('#pvSeg span').forEach(x=>x.classList.toggle('on',x.dataset.m===m));store.set('pvMode',m)}
async function showEditor(code,pid){
 show('vEditor');
 if(CODE!==code||!META){
  const c=await api('/api/c/'+code); if(c.source!=='db'){location.hash='#/k/'+code+'/nastaveni';return}
  CODE=code;API='/api/c/'+code;cur=null;dirty=false;curSec='all';curPrev='all';
  META=await api(API+'/meta'); META.catalog.files_all=c.files; if(META.langs)LANGS=META.langs; if(!LANGS.some(x=>x[0]===LANG))LANG='cs'; renderLangSeg();
  $('#form').innerHTML='<div class="empty">Vyber produkt vlevo nebo založ nový.</div>';$('#pv').srcdoc='';renderPrev(null);
  ptCur();
  await loadList();
 }
 if(pid&&(!cur||cur.id!==pid))await openProduct(pid,true);
}
async function loadList(){const r=await api(API+'/products');LIST=r.products;REMOVED=r.removed;META.linked=r.linked;META.prev=r.prev;META.prev_kind=r.prev_kind;renderList()}
function prevLabel(){const c=CATS.find(c=>c.code===META.prev);return c?c.label:(META.prev||'')}
function renderList(){
 const cnt={new:0,changed:0,same:0}; LIST.forEach(p=>{if(p.prev)cnt[p.prev.status]++});
 const opt=(v,l,c)=>`<option value="${v}"${c===v?' selected':''}>${esc(l)}</option>`;
 const tc={full:0,part:0,none:0}; LIST.forEach(p=>{const t=trOf(p);if(t)tc[t]++});
 $('#trSel').style.display=LANG==='cs'?'none':'';
 if(LANG!=='cs')$('#trSel').innerHTML=[['all',`${LANG.toUpperCase()}: přeloženo ${tc.full} / ${tc.full+tc.part+tc.none}`],['none','Nepřeložené ('+tc.none+')'],['part','Částečně ('+tc.part+')'],['full','Přeložené ('+tc.full+')']].map(([k,l])=>opt(k,l,curTr)).join('');
 $('#trSel').onchange=e=>{curTr=e.target.value;renderList()};
 $('#secSel').innerHTML=opt('all','Všechny sekce ('+LIST.length+')',curSec)+META.sections.map(s=>opt(s.key,s.cz+' ('+LIST.filter(p=>p.section===s.key).length+')',curSec)).join('');
 $('#prevSel').style.display=META.prev?'':'none';
 $('#prevSel').innerHTML=[['all','Oproti '+prevLabel()+': vše'],['new','Nové ('+cnt.new+')'],['changed','Změněné ('+cnt.changed+')'],['same','Beze změny ('+cnt.same+')'],['removed','Vyřazené ('+REMOVED.length+')']].map(([k,l])=>opt(k,l,curPrev)).join('');
 const q=$('#q').value.trim().toLowerCase(); const el=$('#items'); let h='',last=null;
 if(curPrev==='removed'){
  const items=REMOVED.filter(r=>(curSec==='all'||r.section===curSec)&&(!q||r.name.toLowerCase().includes(q)));
  h=`<div class="serie-h">Byly v ${esc(prevLabel())}, letos chybí</div>`+items.map(r=>`<div class="item" data-rk="${esc(r.key)}"><div class="nm">${esc(r.name)}<small>${esc(secName(r.section))}${r.page?' · str. '+r.page:''}</small></div></div>`).join('');
  el.innerHTML=items.length?h:'<div class="empty">Nic nechybí</div>';
 }else{
  const items=LIST.filter(p=>(curSec==='all'||p.section===curSec)&&(curPrev==='all'||(p.prev&&p.prev.status===curPrev))&&(LANG==='cs'||curTr==='all'||trOf(p)===curTr)&&(!q||(p.name+' '+(p.serie||'')+' '+(p.typ||'')).toLowerCase().includes(q)));
  for(const p of items){
   const key=p.section+'|'+p.serie; if(key!==last){h+=`<div class="serie-h">${esc(secName(p.section))} · ${esc(p.serie||'bez série')}</div>`;last=key}
   const ps=p.prev?(p.prev.status==='new'?`<span class="pst new" title="V ${esc(prevLabel())} nebyl">NOVÝ</span>`:p.prev.status==='changed'?`<span class="pst changed" title="Změna oproti ${esc(prevLabel())}">${p.prev.added||p.prev.removed?((p.prev.added?'+'+p.prev.added:'')+(p.prev.removed?' −'+p.prev.removed:'')).trim()+' barev':'ZMĚNA'}</span>`:''):'';
   h+=`<div class="item${cur&&cur.id===p.id?' on':''}" data-id="${esc(p.id)}"><img src="${p.thumb?'/thumb/'+p.thumb+'?w=120':''}" loading="lazy" onerror="this.style.visibility='hidden'"><div class="nm">${esc(p.name)}${p.new?' <span style="color:var(--acc);font-size:9px">NOVINKA</span>':''}${trDot(p)}${ps}<small>${esc(p.typ||'')} · ${p.n_colors} barev</small></div><div class="mv"><button data-mv="-1" title="Nahoru">▲</button><button data-mv="1" title="Dolů">▼</button></div></div>`;
  }
  el.innerHTML=h||'<div class="empty">Nic nenalezeno</div>';
 }
 el.onclick=async e=>{const b=e.target.closest('button[data-mv]');const it=e.target.closest('.item');if(!it)return;
  if(it.dataset.rk){showRemoved(it.dataset.rk);return}
  if(b){e.stopPropagation();await move(it.dataset.id,+b.dataset.mv);return}
  openProduct(it.dataset.id).catch(e=>alert('Nepodařilo se otevřít produkt: '+e.message))};
}
function secName(k){return (META.sections.find(s=>s.key===k)||{}).cz||k||''}
function setHash(h){history.replaceState(null,'',h);lastHash=location.hash}
async function move(id,d){
 const p=LIST.find(x=>x.id===id); const ids=LIST.filter(x=>x.section===p.section).map(x=>x.id); const i=ids.indexOf(id), j=i+d;
 if(j<0||j>=ids.length)return; [ids[i],ids[j]]=[ids[j],ids[i]];
 try{await api(API+'/reorder',{method:'POST',body:JSON.stringify({section:p.section,ids})})}catch(e){alert(errText(e))} await loadList();
}
async function openProduct(id,fromRoute){
 if(!fromRoute&&dirty&&!confirm('Zahodit neuložené změny?'))return;
 cur=await api(API+'/products/'+encodeURIComponent(id)); dirty=false; setHash(`#/k/${CODE}/p/${encodeURIComponent(id)}`); renderForm(); renderList(); preview();
}
async function newProduct(){
 if(dirty&&!confirm('Zahodit neuložené změny?'))return;
 const section=curSec==='all'?META.sections[0].key:curSec; const name=prompt('Název produktu:'); if(!name)return;
 try{cur=await api(API+'/products',{method:'POST',body:JSON.stringify({section,name:name.toUpperCase()})})}catch(e){return alert(errText(e))}
 dirty=false; await loadList(); setHash(`#/k/${CODE}/p/${encodeURIComponent(cur.id)}`); renderForm(); preview();
}
// produkt, který byl loni a letos chybí: ukáže loňskou kartu a nabídne vrácení do katalogu
async function showRemoved(key){
 if(dirty&&!confirm('Zahodit neuložené změny?'))return;
 cur=null;dirty=false;const r=REMOVED.find(x=>x.key===key);
 $('#form').innerHTML=`<div class="bar"><h1>${esc(r.name)}</h1></div><div class="sec"><h2>Vyřazený model</h2><p>Tento model byl v katalogu ${esc(prevLabel())}${r.page?' (strana '+r.page+')':''}, v ${esc(META.catalog.label)} není.</p>
  <div class="inline" style="margin-top:12px"><button class="pri" id="bRestore">Vrátit do katalogu</button><span class="hint">${META.prev_kind==='card'?'Převezme celý loňský záznam včetně fotek a barev.':'Převezme texty vytěžené z PDF; fotky a ceny je potřeba doplnit.'}</span></div></div>`;
 $('#bRestore').onclick=async()=>{try{const p=await api(API+'/restore',{method:'POST',body:JSON.stringify({key})});curPrev='all';await loadList();openProduct(p.id)}catch(e){alert(errText(e))}};
 $('#pv').srcdoc='<body style="font:13px Helvetica;color:#999;padding:30px;text-align:center">V letošním katalogu není</body>';
 renderPrev(await api(API+'/prev',{method:'POST',body:JSON.stringify({key})}));
 if($('#preview').dataset.mode==='cur')setMode('prev');
}
// ---------- loňská karta ----------
function diffText(d){
 const p=[];
 if(d.colors_added.length)p.push(`<b class="plus">+ ${pl(d.colors_added.length,'barva','barvy','barev')}</b> (${d.colors_added.map(esc).join(', ')})`);
 if(d.colors_removed.length)p.push(`<b class="minus">− ${pl(d.colors_removed.length,'barva','barvy','barev')}</b> (${d.colors_removed.map(esc).join(', ')})`);
 if(d.colors_count)p.push(`<b class="${d.colors_count[1]>d.colors_count[0]?'plus':'minus'}">barev loni ${d.colors_count[0]}, letos ${d.colors_count[1]}</b>`);
 if(d.price)p.push(`<b class="chg">cena ${fmtKc(d.price[0])} → ${fmtKc(d.price[1])} Kč</b>`);
 if(d.changed.length)p.push('<b class="chg">upraveno:</b> '+d.changed.map(esc).join(', '));
 return p.length?p.join(' · '):'beze změny';
}
function renderPrev(info){
 const strip=$('#pvStrip'), box=$('#pvPrev');
 if(!info||!info.kind){strip.style.display='none';box.dataset.sig='';$('#ptPrev').textContent='Loni';
  box.innerHTML=`<div class="empty">${info?'Katalog nemá loňský katalog k porovnání.<br>Nastavíš ho v nastavení katalogu.':''}</div>`;return}
 $('#ptPrev').textContent='Loni · '+info.label+(info.found&&info.page?' · str. '+info.page:'');
 const links=cur?`<a id="pvAssign">${info.found?'jiná karta':'přiřadit loňskou kartu'}</a>`:'';
 strip.style.display='block';
 strip.innerHTML=info.found?`<b>Oproti ${esc(info.label)}:</b> ${info.diff?diffText(info.diff):esc(info.name)}${info.name&&cur&&info.name!==cur.name?` · loni jako „${esc(info.name)}“`:''}${links}${info.pdf?`<a href="${info.pdf}" target="_blank">strana v PDF ↗</a>`:''}`
  :`<b class="plus">Nový model</b> – v ${esc(info.label)} nebyl.${links}`;
 if($('#pvAssign'))$('#pvAssign').onclick=assignPrev;
 const sig=info.found?info.catalog+'|'+info.key:'none';
 if(box.dataset.sig!==sig){box.dataset.sig=sig;
  box.innerHTML=!info.found?'<div class="empty">Loňská karta neexistuje.<br>Produkt je v katalogu nově.</div>':info.kind==='image'?`<img src="/${info.image}" alt="">`:`<iframe src="/api/c/${info.catalog}/preview/${encodeURIComponent(info.key)}"></iframe>`}
}
async function assignPrev(){
 const l=await api(API+'/prevlist');
 pmOpen('Loňská karta produktu',`<div class="inline"><input type="text" id="apQ" placeholder="hledat v ${esc(prevLabel())}…" style="flex:1"><button data-k="">Podle názvu (automaticky)</button><button data-k="-">Žádná – nový model</button></div><div class="lib" id="apL" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr))"></div>`);
 const draw=()=>{const q=$('#apQ').value.trim().toLowerCase();$('#apL').innerHTML=l.filter(x=>!q||x.name.toLowerCase().includes(q)).map(x=>`<div data-k="${esc(x.key)}" style="text-align:left;font-size:12px;padding:8px"><b>${esc(x.name)}</b><br>${esc(secName(x.section))}${x.page?' · str. '+x.page:''}</div>`).join('')};
 $('#apQ').oninput=draw;draw();$('#apQ').focus();
 $('#pmBody').onclick=e=>{const d=e.target.closest('[data-k]');if(!d)return;$('#pmBody').onclick=null;cur.prev_id=d.dataset.k||null;pmClose();setDirty();preview()};
}

  <button data-op="pad" data-f="0.9" title="Přidá kolem fotky okraj, produkt bude v kartě menší">− Zmenšit (přidat okraj)</button><button data-op="pad" data-f="1.1" title="Ubere okraj, produkt bude v kartě větší">+ Zvětšit (ubrat okraj)</button><button data-op="trim">Oříznout okraje</button><button data-op="whiten">Vybělit pozadí</button><button data-op="alpha">Průhledné pozadí (PNG)</button>
  <label class="inline" style="margin:0">tolerance <input type="range" id="edTol" min="8" max="90" value="30" style="width:110px"><span id="edTolV">30</span></label>

  <div class="hint">Zmenšit / Zvětšit mění velikost produktu v kartě po 10 %: přidává nebo ubírá okraj (bílý, u PNG průhledný), samotný produkt se nikdy neořízne. Jde klikat opakovaně. Ořez: tažením myší přes obrázek vyber oblast a klikni „Oříznout výběr“. Úpravy vytvářejí novou kopii, původní soubor zůstává v knihovně.</div>
  <div class="inline"><span class="status" id="edSt"></span><span class="sp"></span><button id="edCancel">Zrušit</button><button id="edApply" class="pri">Použít</button></div>`);
 const img=$('#edImg'), stage=$('#edStage'), box=$('#edCropBox'); let sel=null, drag=null;
 const tol=$('#edTol'); tol.oninput=()=>$('#edTolV').textContent=tol.value;
 const show=p=>{work=p;img.src='/'+p+'?t='+Date.now();sel=null;box.style.display='none';$('#edCrop').disabled=true};
 const run=async body=>{$('#edSt').textContent='pracuji…';try{const r=await api('/api/edit',{method:'POST',body:JSON.stringify({path:work,...body})});hist.push(r.path);show(r.path);$('#edSt').textContent=`${r.w}×${r.h}`}catch(e){$('#edSt').textContent=errText(e)}};
 $('#pmBody').querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>{const o={op:b.dataset.op};if(b.dataset.deg)o.deg=+b.dataset.deg;if(b.dataset.f)o.factor=+b.dataset.f;if(o.op==='whiten'||o.op==='alpha')o.thresh=+tol.value;run(o)});
 $('#edUndo').onclick=()=>{if(hist.length>1){hist.pop();show(hist[hist.length-1])}};
 $('#edCancel').onclick=pmClose; $('#edApply').onclick=()=>{apply(work);pmClose()};
 const rect=()=>img.getBoundingClientRect();
 stage.onmousedown=e=>{const r=rect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)return;drag={x:e.clientX,y:e.clientY};e.preventDefault()};
 stage.onmousemove=e=>{if(!drag)return;const r=rect(),sr=stage.getBoundingClientRect();const x0=Math.max(r.left,Math.min(drag.x,e.clientX)),y0=Math.max(r.top,Math.min(drag.y,e.clientY)),x1=Math.min(r.right,Math.max(drag.x,e.clientX)),y1=Math.min(r.bottom,Math.max(drag.y,e.clientY));
  box.style.display='block';box.style.left=(x0-sr.left)+'px';box.style.top=(y0-sr.top)+'px';box.style.width=(x1-x0)+'px';box.style.height=(y1-y0)+'px';
  sel={x:(x0-r.left)/r.width,y:(y0-r.top)/r.height,w:(x1-x0)/r.width,h:(y1-y0)/r.height}};
 stage.onmouseup=()=>{drag=null;$('#edCrop').disabled=!(sel&&sel.w>0.02&&sel.h>0.02)};
 $('#edCrop').onclick=()=>sel&&run({op:'crop',...sel});
}

 const go=async()=>{const u=$('#webUrl').value.trim();if(!u)return;$('#web').innerHTML='<div class="hint">načítám…</div>';

let GEN=null;
function openGen(code){GEN=code;if(ME.online){$('#gPush').checked=false;$('#gPush').closest('label').style.display='none'}const c=CATS.find(c=>c.code===code);$('#mTitle').textContent='Generování katalogu '+(c?c.label:code);$('#modal').style.display='flex';$('#mLog').textContent='Připraveno.';$('#mOut').innerHTML='';
 $('#gLangs').innerHTML=LANGS.map(([k,l])=>`<label class="inline" title="${esc(l)}"><input type="checkbox" data-gl="${k}"${k==='cs'||k===LANG?' checked':''}> ${k.toUpperCase()}</label>`).join('')}
async function runGen(){
 if(dirty&&!confirm('Máš neuložené změny. Generovat bez nich?'))return;
 const langs=$$('#gLangs input:checked').map(i=>i.dataset.gl); if(!langs.length)return alert('Vyber aspoň jeden jazyk.');
 $('#mRun').disabled=true; $('#mLog').textContent='Generuji… (PDF trvá zhruba minutu na jazyk)';
 try{const r=await api('/api/c/'+GEN+'/generate',{method:'POST',body:JSON.stringify({pdf:$('#gPdf').checked,push:$('#gPush').checked,langs,prices:$('#gPrices').value})});
  $('#mLog').textContent=r.log; $('#mOut').innerHTML=(r.outputs||[]).map(o=>`<a href="${esc(o.html)}" target="_blank">HTML ${o.lang.toUpperCase()}</a>${o.pdf?` <a href="${esc(o.pdf)}" target="_blank">PDF ${o.lang.toUpperCase()}</a>`:''}`).join(' · ');
  await loadCats(); if($('#vHome').style.display!=='none')renderHome(); if(META&&CODE===GEN)META.catalog.files_all=(CATS.find(c=>c.code===GEN)||{}).files||[]}
 catch(e){$('#mLog').textContent='CHYBA: '+errText(e)}
 $('#mRun').disabled=false;
}

async function loadCats(){const r=await api('/api/catalogs');CATS=r.catalogs;KINDS=r.kinds;if(r.langs)LANGS=r.langs;return CATS}
async function showHome(){show('vHome');await loadCats();renderHome()}
function filesHtml(c){return c.files.length?`<div class="files">${c.files.map(f=>`<a href="${esc(f.url)}" target="_blank"><span class="ext ${f.ext}">${f.ext.toUpperCase()}</span>${esc(f.label)}<small>${f.pages?f.pages+' stran · ':''}${fmtSize(f.size)} · ${fmtDate(f.mtime)}</small></a>`).join('')}</div>`:'<div class="hint">Zatím žádný výstup – katalog ještě nebyl vygenerován.</div>'}
function catCard(c){
 const kind=KINDS.find(k=>k.key===c.kind)||{}; const db_=c.source==='db'; const v=c.vs_prev;
 const cov=c.cover?`style="background-image:url('/thumb/${c.cover}?w=800')"`:(c.cover_pdf?`style="background-image:url('/api/pdfcover?path=${encodeURIComponent(c.cover_pdf)}')"`:'');
 const st=!db_?'<span class="st">archiv · jen PDF</span>':(c.status==='done'?'<span class="st">hotový · uzavřený</span>':'<span class="st draft">rozpracovaný</span>');
 return `<div class="cat" data-code="${c.code}"><div class="cov${c.cover?'':' pdf'}" ${cov} data-act="open"><span class="tag ${c.kind}">${esc((kind.cz||'').toUpperCase())}</span>${st}</div>
 <div class="bd2"><h3>${esc(c.title)} ${esc(c.year)}<small>${c.code}</small></h3>
 ${db_?`<div class="nums"><b>${c.n_products}</b> modelů · <b>${c.n_colors}</b> barevných variant · <b>${c.n_new_flag}</b> novinek</div>`:(c.n_products?`<div class="nums"><b>${c.n_products}</b> karet vytěžených z PDF (slouží jako loňské karty)</div>`:'')}
 ${v?`<div class="vs">oproti ${esc(v.prev)}: <b class="plus">${v.new} nových</b> · <b class="chg">${v.changed} změněných</b> · ${v.same} beze změny · <b class="minus">${v.removed} vyřazených</b></div>`:''}

 ${drafts.length?`<div class="gh">Rozpracované</div><div class="cats">${drafts.map(catCard).join('')}</div>`:''}

 $('#hNew').onclick=e=>menu(e.currentTarget,[...KINDS.map(k=>({label:k.cz+' katalog',sub:'vyjde z loňského, změníš jen to, co je nové',fn:()=>dlgNew(k.key)})),{label:'Hotové PDF do archivu',sub:'starší ročník nebo katalog od grafika',fn:dlgArchive}]);

function dlgNew(kind){

let SET=null;
async function showSettings(code){show('vSettings');if(!CATS.length)await loadCats();SET=await api('/api/c/'+code);renderSettings()}
function renderSettings(){
 const c=SET, db_=c.source==='db', locked=c.status==='done'&&db_;
 const prevOpts=CATS.filter(x=>x.code!==c.code).map(x=>`<option value="${x.code}"${c.prev===x.code?' selected':''}>${esc(x.label)}${x.source==='db'?'':' (PDF)'}</option>`).join('');

 ${db_?`<div class="sec"><h2>Loňský katalog (pro porovnání karet)</h2><div class="row"><div><select id="sPrev"><option value="">— žádný —</option>${prevOpts}</select></div></div><div class="hint">U každého produktu se v editoru ukazuje, jak jeho karta vypadala v tomto katalogu a co se změnilo.</div></div>

  ${avail.length?`<div class="inline"><select id="sAdd" style="width:auto"><option value="">+ přidat sekci…</option>${avail.map(d=>`<option value="${d.key}">${esc(d.cz)}</option>`).join('')}</select></div>`:''}
  <div class="hint">Pořadí sekcí = pořadí v katalogu. Technické strany (obrázky celých stran s tabulkami a piktogramy) se vloží na začátek sekce.</div></div>`:''}

 const mark=()=>{$('#sSt').textContent='neuloženo'};

function fbLoadImg(src){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src})}
// obrázek zmenší na rozumnou velikost, aby prošel i online (limit požadavku)
async function fbShrink(src,max=1800){const i=await fbLoadImg(src),k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);
 const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(i,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.85)}
function fbFile(f){if(!f)return;const r=new FileReader();r.onload=async()=>{try{FB.image=await fbShrink(r.result);fbRender()}catch(e){alert('Obrázek se nepodařilo načíst.')}};r.readAsDataURL(f)}
async function fbCapture(){
 if(!navigator.mediaDevices?.getDisplayMedia)return alert('Tenhle prohlížeč neumí vyfotit obrazovku. Udělej snímek sám a vlož ho sem (Cmd+V) nebo ho přilož jako soubor.');
 $('#fbPanel').style.display='none';$('#fbBtn').style.display='none';let st;
 try{st=await navigator.mediaDevices.getDisplayMedia({video:{displaySurface:'browser'},preferCurrentTab:true,audio:false});
  const v=document.createElement('video');v.srcObject=st;v.muted=true;await v.play();await new Promise(r=>setTimeout(r,350));
  const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);
  FB.image=await fbShrink(c.toDataURL('image/png'))}
 catch(e){if(e.name!=='NotAllowedError')alert('Snímek se nepodařil: '+e.message)}
 finally{if(st)st.getTracks().forEach(t=>t.stop());$('#fbBtn').style.display='';$('#fbPanel').style.display='flex';fbRender()}
 if(FB.image)fbAnnotate();
}
// kreslení do obrázku: tužka, kroužek, šipka; tvary se drží v souřadnicích obrázku
async function fbAnnotate(){
 const img=await fbLoadImg(FB.image),cv=$('#fdCv'),g=cv.getContext('2d');cv.width=img.width;cv.height=img.height;let shapes=[],tool='pen',curS=null;
 $('#fbDraw').style.display='flex';
 const st=cv.parentElement,k=Math.min((st.clientWidth-32)/img.width,(st.clientHeight-32)/img.height,1);cv.style.width=img.width*k+'px';cv.style.height=img.height*k+'px';
 const lw=Math.max(3,Math.round(img.width/320));
 const draw=()=>{g.drawImage(img,0,0);g.strokeStyle='#e3001b';g.fillStyle='#e3001b';g.lineWidth=lw;g.lineCap=g.lineJoin='round';
  for(const s of [...shapes,curS].filter(Boolean)){g.beginPath();
   if(s.t==='pen'){s.p.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.stroke()}
   else if(s.t==='oval'){g.ellipse((s.a[0]+s.b[0])/2,(s.a[1]+s.b[1])/2,Math.abs(s.b[0]-s.a[0])/2,Math.abs(s.b[1]-s.a[1])/2,0,0,7);g.stroke()}
   else{const [x1,y1]=s.a,[x2,y2]=s.b,an=Math.atan2(y2-y1,x2-x1),h=lw*5;g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-h*Math.cos(an-.45),y2-h*Math.sin(an-.45));g.lineTo(x2-h*Math.cos(an+.45),y2-h*Math.sin(an+.45));g.closePath();g.fill()}}};
 const pos=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
 cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);const p=pos(e);curS=tool==='pen'?{t:'pen',p:[p]}:{t:tool,a:p,b:p};draw()};
 cv.onpointermove=e=>{if(!curS)return;const p=pos(e);if(curS.t==='pen')curS.p.push(p);else curS.b=p;draw()};
 cv.onpointerup=()=>{if(curS){shapes.push(curS);curS=null;draw()}};
 $('#fdTool').onclick=e=>{const t=e.target.dataset.t;if(!t)return;tool=t;$$('#fdTool span').forEach(x=>x.classList.toggle('on',x.dataset.t===t))};
 $$('#fdTool span').forEach(x=>x.classList.toggle('on',x.dataset.t==='pen'));
 $('#fdUndo').onclick=()=>{shapes.pop();draw()};
 const close=()=>{$('#fbDraw').style.display='none'};
 $('#fdCancel').onclick=close; $('#fdOk').onclick=()=>{if(shapes.length)FB.image=cv.toDataURL('image/jpeg',.85);close();fbRender()};
 draw();
}

   FB={kind:FB.kind,text:'',image:'',tab:'new'};p.innerHTML=tabs+'<div style="padding:18px 0;text-align:center"><b>Díky, podnět je odeslaný.</b><div class="hint">Stav a odpověď najdeš v záložce Moje podněty.</div></div>';

 pmOpen('Zařadit kartu do katalogu '+CODE,`<div class="inline"><input type="search" id="pcQ" placeholder="Hledat model…" style="flex:1"></div><div class="lib" id="pcL"></div><div class="hint">Klikni na kartu a zařadí se do katalogu (do své sekce, na konec). Karta je společná, nekopíruje se.</div>`);
 const draw=()=>{const q=$('#pcQ').value.trim().toLowerCase();$('#pcL').innerHTML=free.filter(c=>!q||c.name.toLowerCase().includes(q)).map(c=>`<div data-id="${esc(c.id)}">${c.thumb?`<img src="/thumb/${c.thumb}?w=240" loading="lazy">`:''}<b>${esc(c.name)}</b></div>`).join('')||'<div class="hint">Všechny karty už v katalogu jsou.</div>'};
 draw();$('#pcQ').oninput=draw;
 $('#pcL').onclick=async e=>{const d=e.target.closest('[data-id]');if(!d)return;d.style.opacity=.4;
  try{const r=await api(API+'/cards',{method:'POST',body:JSON.stringify({ids:[d.dataset.id]})});if(r.skipped.length){d.style.opacity=1;return alert('Katalog nemá sekci, do které karta patří. Přidej sekci v nastavení katalogu.')}
   free=free.filter(c=>c.id!==d.dataset.id);draw();await loadList()}catch(err){d.style.opacity=1;alert(errText(err))}};
}
// ---------- verze (zálohy) katalogu ----------
const fmtDateTime=t=>fmtDate(t)+' '+new Date(t*1000).toLocaleTimeString('cs-CZ',{hour:'numeric',minute:'2-digit'});
let VER=[], VCAT=null;
async function showVersions(code){show('vVer');if(!CATS.length)await loadCats();VCAT=await api('/api/c/'+code);if(VCAT.source!=='db'){location.hash='#/k/'+code+'/nastaveni';return}
 VER=await api('/api/c/'+code+'/versions');renderVersions()}
function verDiff(v){if(v.same)return 'shodná se současným stavem';const d=v.diff,p=[],names=a=>` (${a.slice(0,6).map(esc).join(', ')}${a.length>6?', …':''})`;
 if(d.changed.length)p.push(`<b class="chg">${pl(d.changed.length,'změněná karta','změněné karty','změněných karet')}</b>${names(d.changed)}`);
 if(d.added.length)p.push(`<b class="plus">${pl(d.added.length,'přidaná','přidané','přidaných')}</b>${names(d.added)}`);
 if(d.removed.length)p.push(`<b class="minus">${pl(d.removed.length,'smazaná','smazané','smazaných')}</b>${names(d.removed)}`);
 if(d.settings)p.push('změněné nastavení nebo sekce');
 return 'od zálohy: '+p.join(' · ')}
function renderVersions(){
 const c=VCAT, locked=c.status==='done', U='/api/c/'+c.code+'/versions';
 $('#verv').innerHTML=`<div class="wrap"><div class="phead"><h1>Verze · ${esc(c.label)}</h1><span class="status" id="vSt"></span></div>
 ${locked?'<div class="lock">Katalog je uzavřený: zálohovat jde, ale vrátit se k záloze až po odemknutí v nastavení katalogu.</div>':''}
 <div class="sec"><h2>Nová záloha</h2><div class="inline"><input type="text" id="vLabel" placeholder="název, např. před korekturou" style="width:320px"><button class="pri" id="vAdd">Zálohovat současný stav</button></div>
  <div class="hint" style="margin-top:8px">Záloha uloží všechny produkty, sekce s technickými stranami a nastavení titulní strany. Fotky se nekopírují, záloha si pamatuje jen, které byly použité – fotku smazanou z úložiště návrat nevrátí.${c.linked?' Katalog skládá společné karty: návrat vrátí i obsah karet, takže se projeví ve všech rozpracovaných katalozích.':''}</div></div>
 <div class="sec"><h2>Zálohy</h2>${VER.map(v=>`<div class="frow" data-id="${v.id}"><div><a>${esc(v.label||'Záloha '+fmtDateTime(v.created))}</a>${v.auto?' <span class="hint">· automatická</span>':''}
   <div class="hint">${fmtDateTime(v.created)}${v.author?' · '+esc(v.author):''} · ${pl(v.n,'model','modely','modelů')} · ${pl(v.colors,'barva','barvy','barev')}</div><div class="hint">${verDiff(v)}</div></div><span class="sp"></span>
   <button data-v="restore"${locked||v.same?' disabled':''}>Vrátit se k této verzi</button><button class="more" data-v="more" title="Další akce">⋯</button></div>`).join('')||'<div class="hint">Zatím žádná záloha.</div>'}
  <div class="hint" style="margin-top:8px">Automatická záloha vzniká před návratem k jiné verzi, před použitím objednávkového formuláře a při generování katalogu; drží se jich posledních 10. Přejmenováním se z automatické stane trvalá.</div></div></div>`;
 const run=async(msg,f)=>{$('#vSt').textContent=msg;try{VER=await f();renderVersions()}catch(e){$('#vSt').textContent='';alert(errText(e))}};
 $('#vAdd').onclick=()=>run('zálohuji…',()=>api(U,{method:'POST',body:JSON.stringify({label:$('#vLabel').value})}));
 $('#vLabel').onkeydown=e=>{if(e.key==='Enter')$('#vAdd').click()};
 $('#verv').querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const v=VER.find(v=>v.id===b.closest('[data-id]').dataset.id),nm=v.label||fmtDateTime(v.created);
  if(b.dataset.v==='more')menu(b,[{label:'Přejmenovat',fn:()=>act('rename')},{label:'Smazat zálohu',dan:1,fn:()=>act('del')}]);else act('restore');
  function act(a){
  if(a==='restore'){if(!confirm(`Vrátit katalog ${c.code} k verzi „${nm}“?\n\nSoučasný stav se před tím sám zazálohuje, takže návrat půjde vzít zpět.`))return;
   run('vracím…',async()=>{const r=await api(U+'/'+v.id+'/restore',{method:'POST'});if(CODE===c.code)META=null;await loadCats();VCAT=await api('/api/c/'+c.code);return r})}
  else if(a==='rename'){const l=prompt('Název zálohy:',v.label||'');if(l===null)return;run('',()=>api(U+'/'+v.id,{method:'PUT',body:JSON.stringify({label:l})}))}
  else if(a==='del'){if(!confirm(`Smazat zálohu „${nm}“? Tohle vrátit nejde.`))return;run('',()=>api(U+'/'+v.id,{method:'DELETE'}))}}});
}

let PLAN=null, FCODE=null;
async function uploadForm(code,files){const fd=new FormData();files.forEach(f=>fd.append('files',f));const r=await fetch('/api/c/'+code+'/form',{method:'POST',body:fd});if(!r.ok)throw new Error(await r.text());return r.json()}
async function showForm(code){show('vForm');if(!CATS.length)await loadCats();FCODE=code;const c=await api('/api/c/'+code);if(c.source!=='db'){location.hash='#/k/'+code+'/nastaveni';return}
 FCODE_C=c;PLAN=await api('/api/c/'+code+'/form');renderFormView()}
let FCODE_C=null;
function chgHtml(c){const p=[];
 if(c.name)p.push(`<b class="chg">název</b> ${esc(c.name[0])} → ${esc(c.name[1])}`);
 if(c.colors_added.length)p.push(`<b class="plus">+ ${pl(c.colors_added.length,'barva','barvy','barev')}</b> ${c.colors_added.map(esc).join(', ')}`);
 if(c.colors_removed.length)p.push(`<b class="minus">− ${pl(c.colors_removed.length,'barva','barvy','barev')}</b> ${c.colors_removed.map(esc).join(', ')}`);
 if(c.price){const f=a=>a[0]==null?'—':(a[0]===a[1]||a[1]==null?fmtKc(a[0]):fmtKc(a[0])+'–'+fmtKc(a[1]));p.push(`<b class="chg">cena</b> ${f(c.price[0])} → ${f(c.price[1])} Kč`)}
 if(c.sizes)p.push(`<b class="chg">velikosti</b> ${esc(c.sizes[0].join(', ')||'—')} → ${esc(c.sizes[1].join(', '))}`);
 return p.join(' · ')}
function renderFormView(){
 const c=FCODE_C, P=PLAN&&!PLAN.none?PLAN:null, sec=k=>(c.sections.find(s=>s.key===k)||{}).cz||k, locked=c.status==='done';
 let h=`<div class="wrap"><div class="phead"><h1>Předobjednávkový formulář · ${esc(c.label)}</h1><span class="status" id="fSt"></span></div>
 ${locked?'<div class="lock">Katalog je uzavřený – formulář nejde nahrát ani použít. Odemkneš ho v nastavení katalogu.</div>':`<div class="upz" id="fUp"><b>${P?'Nahrát novou verzi formuláře':'Nahraj předobjednávkový formulář (.xlsx)'}</b><br><span class="hint">Klikni nebo sem soubory přetáhni. Camp i oblečení můžeš nahrát najednou. Stačí sloupce Model, Položka a cena; Barva, Velikost, SK a registrační číslo se použijí, když tam jsou.</span></div>`}`;
 if(P){
  const chg=P.matched.filter(x=>x.changes.any), same=P.matched.length-chg.length;
  h+=`<div class="hint" style="margin-bottom:10px">Načteno: ${P.files.map(esc).join(', ')} · ${P.rows} řádků · ${P.n_models} modelů</div>
  ${P.warnings.map(w=>`<div class="lock">${esc(w)}</div>`).join('')}
  <div class="tiles"><div><b>${same}</b>karet sedí s formulářem</div><div><b>${chg.length}</b>karet ke změně</div><div><b>${P.new.length}</b>modelů bez karty</div><div><b>${P.missing.length}</b>karet není ve formuláři</div></div>`;
  const sk=Object.entries(P.skipped||{});
  if(sk.length)h+=`<div class="hint" style="margin-bottom:10px">Formulář neobsahuje žádný model ze sekcí: ${sk.map(([k,n])=>esc(sec(k))+' ('+n+')').join(', ')}. Jejich karty zůstávají beze změny.</div>`;
  if(!chg.length&&!P.new.length&&!P.missing.length&&!P.order.moved)h+='<div class="sec"><h2>Hotovo</h2>Katalog odpovídá formuláři včetně pořadí produktů, není co měnit.</div>';
  else{
   h+=`<div class="sec"><h2>Co se má podle formuláře upravit</h2><div class="inline"><label class="inline"><input type="checkbox" id="oPrice" checked> ceny</label><label class="inline"><input type="checkbox" id="oAdd" checked> přidat nové barvy</label><label class="inline"><input type="checkbox" id="oRem" checked> ubrat barvy, které ve formuláři nejsou</label><label class="inline"><input type="checkbox" id="oSize" checked> velikosti</label><label class="inline"><input type="checkbox" id="oRen"> přepsat názvy barev podle formuláře</label><label class="inline"><input type="checkbox" id="oOrd" checked> pořadí produktů přesně podle formuláře</label></div>
    <div class="hint">Texty, fotky, rozkresy a ikony hotových karet zůstávají. Nová barva dostane fotku a rozkres, pokud je už má stejný model v jiném katalogu.</div></div>`;
   h+=`<div class="sec"><h2>Pořadí produktů</h2>${P.order.moved?`<b class="chg" style="color:#c77700">${pl(P.order.moved,'karta je','karty jsou','karet je')} na jiném místě než ve formuláři</b> – seřadí se přesně podle formuláře. Pořadí barev u karet se nemění.`:'Pořadí produktů odpovídá formuláři.'}
    ${P.order.splits.map(x=>`<div class="lock" style="margin:8px 0 0"><b>${x.names.map(esc).join(', ')}</b> (série „${esc(x.serie||'bez série')}“): po seřazení bude stát samostatně za sérií „${esc(x.after||'bez série')}“ a v katalogu tak vznikne další nadpis série. Jestli patří do série „${esc(x.after||'bez série')}“, oprav u karty pole Série; jinak je to v pořádku.</div>`).join('')}</div>`;
   if(chg.length)h+=`<div class="sec"><h2>Změny u hotových karet (${chg.length})</h2><table class="plan">${chg.map(x=>`<tr><td><input type="checkbox" data-mk="${esc(x.key)}" checked></td><td class="nm"><a href="#/k/${c.code}/p/${encodeURIComponent(x.pid)}" style="color:inherit">${esc(x.name)}</a></td><td>${chgHtml(x.changes)}</td></tr>`).join('')}</table></div>`;
   if(P.new.length)h+=`<div class="sec"><h2>Modely ve formuláři, které v katalogu nemají kartu (${P.new.length})</h2><table class="plan">${P.new.map(n=>`<tr><td></td><td class="nm">${esc(n.name)}</td><td>${esc(sec(n.section))} · ${esc(n.typ)} · ${n.price_min!=null?fmtKc(n.price_min)+' Kč':'bez ceny'} · ${pl(n.colors.length,'barva','barvy','barev')}<br><span class="hint">${n.colors.map(esc).join(', ')}</span></td>
     <td><select data-nk="${esc(n.key)}">${n.source?`<option value="copy">převzít hotovou kartu z ${esc(n.source.label)}</option>`:''}<option value="create">založit novou prázdnou kartu</option>${P.missing.filter(m=>m.section===n.section).map(m=>`<option value="pair:${esc(m.pid)}"${n.suggest===m.pid?' selected':''}>je to přejmenovaný model: ${esc(m.name)}</option>`).join('')}<option value="skip">přeskočit</option></select></td></tr>`).join('')}</table>
     <div class="hint" style="margin-top:8px">Nové karty dostanou štítek „Novinka“. U přejmenovaného modelu zůstane celá karta a změní se jen název a údaje z formuláře.</div></div>`;
   if(P.missing.length)h+=`<div class="sec"><h2>Karty, které ve formuláři nejsou (${P.missing.length})</h2><div class="inline" style="margin-bottom:6px"><button class="sm" id="mAll">zaškrtnout vše</button><button class="sm" id="mNone">odškrtnout vše</button><span class="hint">Zaškrtnuté se z katalogu vyřadí. V loňském katalogu zůstávají a jdou kdykoli vrátit (filtr „vyřazené“).</span></div>
     <table class="plan">${P.missing.map(m=>`<tr><td><input type="checkbox" data-rm="${esc(m.pid)}" checked></td><td class="nm"><a href="#/k/${c.code}/p/${encodeURIComponent(m.pid)}" style="color:inherit">${esc(m.name)}</a></td><td>${esc(sec(m.section))} · ${esc(m.serie)} · ${pl(m.n_colors,'barva','barvy','barev')}</td></tr>`).join('')}</table></div>`;
   h+=`<div class="inline"><span class="sp"></span><button class="pri" id="fGo" style="padding:10px 22px"${locked?' disabled':''}>Provést změny v katalogu</button></div>`;
  }
 }
 $('#formv').innerHTML=h+'</div>';
 const up=async files=>{files=files.filter(f=>/\.xlsx$/i.test(f.name));if(!files.length)return alert('Vyber soubory .xlsx');$('#fSt').textContent='čtu formulář…';try{PLAN=await uploadForm(c.code,files);renderFormView()}catch(e){$('#fSt').textContent='';alert(errText(e))}};
 const z=$('#fUp');if(z){z.onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='.xlsx';i.multiple=true;i.onchange=()=>up([...i.files]);i.click()};
  z.ondragover=e=>{e.preventDefault();z.classList.add('over')};z.ondragleave=()=>z.classList.remove('over');z.ondrop=e=>{e.preventDefault();z.classList.remove('over');up([...e.dataTransfer.files])}}
 if($('#mAll'))$('#mAll').onclick=()=>$$('[data-rm]').forEach(x=>x.checked=true);if($('#mNone'))$('#mNone').onclick=()=>$$('[data-rm]').forEach(x=>x.checked=false);
 // karta spárovaná jako přejmenovaný model se nesmí zároveň vyřadit
 const sync=()=>{const paired=$$('[data-nk]').map(s=>s.value).filter(v=>v.startsWith('pair:')).map(v=>v.slice(5));$$('[data-rm]').forEach(x=>{const p=paired.includes(x.dataset.rm);x.disabled=p;if(p)x.checked=false})};
 $$('[data-nk]').forEach(s=>s.onchange=sync);sync();
 if($('#fGo'))$('#fGo').onclick=async()=>{
  const body={opts:{prices:$('#oPrice').checked,add_colors:$('#oAdd').checked,remove_colors:$('#oRem').checked,sizes:$('#oSize').checked,rename_colors:$('#oRen').checked,order:$('#oOrd').checked},
   skip:$$('[data-mk]').filter(x=>!x.checked).map(x=>x.dataset.mk),new:Object.fromEntries($$('[data-nk]').map(s=>[s.dataset.nk,s.value])),remove:$$('[data-rm]').filter(x=>x.checked).map(x=>x.dataset.rm)};
  const nNew=Object.values(body.new).filter(v=>v!=='skip').length;
  if(!confirm(`Provést v katalogu ${c.label}?\n\n• upravit ${$$('[data-mk]').filter(x=>x.checked).length} karet\n• doplnit ${nNew} modelů\n• vyřadit ${body.remove.length} karet${body.opts.order&&P.order.moved?'\n• seřadit produkty podle formuláře':''}`))return;
  $('#fGo').disabled=true;$('#fSt').textContent='provádím…';
  try{const r=await api('/api/c/'+c.code+'/form/apply',{method:'POST',body:JSON.stringify(body)});META=null;await loadCats();PLAN=await api('/api/c/'+c.code+'/form');renderFormView();
   $('#fSt').textContent=`hotovo: upraveno ${r.updated||0}, nových karet ${r.created||0}, převzatých ${r.copied||0}, přejmenovaných ${r.paired||0}, vyřazeno ${r.removed||0}${r.moved?', přeřazeno '+r.moved:''}`}
  catch(e){alert(errText(e));$('#fGo').disabled=false;$('#fSt').textContent=''}};

let ST={q:'',folder:'',used:'',catalog:'',n:240,data:null};
async function showStorage(){show('vStorage');if(!CATS.length)await loadCats();
 $('#storage').innerHTML=`<div class="phead"><h1>Úložiště fotek</h1><span class="hint" id="stSum"></span><span class="sp"></span><select id="stUpF" style="width:auto"><option value="foto">nahrát do: fotky produktů</option><option value="rozkresy">nahrát do: rozkresy</option><option value="ikony">nahrát do: ikony</option><option value="pages">nahrát do: technické strany</option><option value="hero">nahrát do: úvodní fotky</option></select><button class="pri" id="stUp">Nahrát soubory</button></div>
 <div class="inline" style="margin-bottom:10px"><input type="search" id="stQ" placeholder="hledat podle názvu souboru nebo produktu…" style="width:320px;padding:7px 10px;border:1px solid var(--b);border-radius:4px;font:inherit" value="${esc(ST.q)}">

 <div class="chips" id="stFold" style="margin-bottom:14px"></div><div class="stor" id="stGrid"></div><div class="inline" style="justify-content:center;margin-top:16px"><button id="stMore" style="display:none">Zobrazit další</button></div>

 $('#stMore').onclick=()=>{ST.n+=480;drawStorage()};
 const upMany=async files=>{files=files.filter(f=>f.type.startsWith('image/'));if(!files.length)return;$('#stSum').textContent='nahrávám '+files.length+' souborů…';for(let f of files){f=await shrink(f,$('#stUpF').value);const fd=new FormData();fd.append('file',f);fd.append('kind',$('#stUpF').value);fd.append('name',f.name.replace(/\.[^.]+$/,''));await fetch('/api/upload',{method:'POST',body:fd})}loadStorage()};

function drawStorage(){
 const d=ST.data, all=d.folders.reduce((a,f)=>a+f.n,0);

 $('#stFold').innerHTML=`<span class="chip${ST.folder?'':' on'}" data-f="">Vše ${all}</span>`+d.folders.map(f=>`<span class="chip${ST.folder===f.key?' on':''}" data-f="${f.key}">${esc(f.label)} ${f.n}</span>`).join('');
 $('#stGrid').innerHTML=d.files.slice(0,ST.n).map(f=>`<div class="f" data-p="${esc(f.path)}"><img src="/thumb/${f.path}?w=240" loading="lazy"><span class="u${f.uses.length?'':' no'}">${f.uses.length?f.uses.length+'×':'nepoužito'}</span>${esc(f.name)}<br>${fmtSize(f.size)}</div>`).join('')||'<div class="hint">Nic nenalezeno.</div>';
 $('#stMore').style.display=d.files.length>ST.n?'':'none';

function storageDetail(f){
 pmOpen(f.name,`<div class="det"><div style="text-align:center"><img src="/${f.path}"></div><div><div class="hint">${esc(f.path)}<br>${fmtSize(f.size)} · nahráno ${fmtDate(f.mtime)}</div>
  <div class="gh" style="margin-top:14px">${f.uses.length?'Použito '+f.uses.length+'×':'Nikde nepoužito'}</div><ul>${f.uses.map(u=>`<li>${u.catalog==='karty'?`<b>karta mimo katalogy</b> · ${esc(u.name)} · `:`<b>${esc(u.catalog)}</b> · ${u.id?`<a href="#/k/${u.catalog}/p/${encodeURIComponent(u.id)}" data-go>${esc(u.name)}</a> · `:''}`}${esc(u.what)}</li>`).join('')}</ul>
  <div class="inline" style="margin-top:14px"><a href="/${f.path}" target="_blank"><button>Otevřít originál</button></a><button id="sdEdit">Upravit kopii</button>${f.uses.length?'':'<button class="dan" id="sdDel">Smazat soubor</button>'}</div></div></div>`);
 $('#pmBody').querySelectorAll('[data-go]').forEach(a=>a.onclick=pmClose);
 $('#sdEdit').onclick=()=>openEditor(f.path,f.folder,()=>loadStorage());
 if($('#sdDel'))$('#sdDel').onclick=async()=>{if(!confirm('Smazat soubor natrvalo?'))return;try{await api('/api/storage?path='+encodeURIComponent(f.path),{method:'DELETE'});pmClose();loadStorage()}catch(e){alert(errText(e))}};
}
// ---------- přihlášení a uživatelé ----------
let ME={};
async function loadMe(){ME=await api('/api/auth/me');fbInit();if(!ME.auth)return;
 $('#who').style.display='flex';$('#whoMail').textContent=ME.email;$('#nUsers').style.display=ME.role==='admin'?'':'none';$('#nUsers').textContent='Uživatelé'+(ME.pending?' ('+ME.pending+')':'');
 $('#bOut').onclick=async()=>{await api('/api/auth/logout',{method:'POST'});location.href='/login'};
 $('#bPw').onclick=()=>{pmOpen('Změna hesla',`<div class="row"><div><label>Současné heslo</label><input type="password" id="pwO" style="width:100%;padding:7px 9px;border:1px solid var(--b);border-radius:4px"></div><div><label>Nové heslo (aspoň 8 znaků)</label><input type="password" id="pwN" style="width:100%;padding:7px 9px;border:1px solid var(--b);border-radius:4px"></div></div><div class="inline"><span class="status" id="pwSt"></span><span class="sp"></span><button class="pri" id="pwGo">Změnit heslo</button></div>`);
  $('#pwGo').onclick=async()=>{try{await api('/api/auth/password',{method:'POST',body:JSON.stringify({old:$('#pwO').value,new:$('#pwN').value})});pmClose()}catch(e){$('#pwSt').textContent=errText(e)}}};
}
async function showUsers(){show('vUsers');const L=await api('/api/users');const dt=t=>t?fmtDate(t):'—';
 $('#usersv').innerHTML=`<div class="wrap"><div class="phead"><h1>Uživatelé</h1><span class="hint">Účet jde založit jen s e-mailem ${ME.domains.map(d=>'@'+esc(d)).join(', ')}. Kdo se zaregistruje sám, čeká tady na schválení.</span></div>
 <div class="sec"><h2>Přidat uživatele</h2><div class="inline"><input type="text" id="uE" placeholder="jmeno@${esc(ME.domains[0])}" style="width:260px"><input type="text" id="uP" placeholder="první heslo (aspoň 8 znaků)" style="width:240px"><label class="inline"><input type="checkbox" id="uA"> správce</label><button class="pri" id="uAdd">Přidat</button></div></div>
 <div class="sec"><h2>Účty (${L.length})</h2><table class="plan">${L.map(u=>`<tr data-e="${esc(u.email)}"><td></td><td class="nm">${esc(u.email)}</td><td>${u.active?(u.role==='admin'?'<b>správce</b>':'uživatel'):'<b class="chg">čeká na schválení</b>'} · založen ${dt(u.created)} · naposledy přihlášen ${dt(u.last_login)}</td>
  <td style="white-space:nowrap">${u.active?'':'<button class="sm pri" data-a="approve">Schválit</button> '}${u.email===ME.email?'<span class="hint">to jsi ty</span>':`${u.active?`<button class="sm" data-a="role">${u.role==='admin'?'Odebrat správce':'Udělat správcem'}</button> <button class="sm" data-a="block">Zablokovat</button> `:''}<button class="sm" data-a="pw">Nové heslo</button> <button class="sm dan" data-a="del">Smazat</button>`}</td></tr>`).join('')}</table></div></div>`;
 const call=async(m,u,b)=>{try{await api(u,{method:m,body:b?JSON.stringify(b):undefined});await loadMe();showUsers()}catch(e){alert(errText(e))}};
 $('#uAdd').onclick=()=>call('POST','/api/users',{email:$('#uE').value,password:$('#uP').value,role:$('#uA').checked?'admin':'user'});
 $('#usersv').querySelector('table').onclick=e=>{const a=e.target.dataset.a;if(!a)return;const em=e.target.closest('tr').dataset.e,u=L.find(x=>x.email===em),url='/api/users/'+encodeURIComponent(em);
  if(a==='approve')call('PUT',url,{active:true});else if(a==='block')call('PUT',url,{active:false});else if(a==='role')call('PUT',url,{role:u.role==='admin'?'user':'admin'});
  else if(a==='pw'){const p=prompt('Nové heslo pro '+em+' (aspoň 8 znaků):');if(p)call('PUT',url,{password:p})}
  else if(a==='del'&&confirm('Smazat účet '+em+'?'))call('DELETE',url)};
}
loadMe().then(loadCats).then(boot);
